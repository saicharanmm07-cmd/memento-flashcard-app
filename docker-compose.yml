version: '3.8'
services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"

  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongo

  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - server